<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TACTICAL FPS</title>
<style>
body{margin:0;overflow:hidden;background:#000;color:#fff;font-family:sans-serif}
#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;z-index:10}
#hud{position:fixed;top:10px;left:10px;z-index:10;background:rgba(0,0,0,.6);padding:10px;border-radius:8px}
#menu{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;text-align:center}
button{padding:15px 30px;font-size:20px;background:#00ff88;border:none;border-radius:10px;font-weight:bold}
</style>
</head>
<body>
<div id="cross">+</div>
<div id="hud">SCORE: <span id="score">0</span><br>AMMO: <span id="ammo">30</span><br>WASD Jalan | Mouse Lihat | Klik Tembak</div>
<div id="menu"><h1>🔫 TACTICAL FPS</h1><p>Klik PLAY, lalu klik layar untuk kunci mouse</p><button onclick="start()">▶ PLAY</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene,camera,renderer,score=0,ammo=30,targets=[],keys={},yaw=0,pitch=0,locked=false;
function start(){
document.getElementById('menu').style.display='none';
init();
document.body.requestPointerLock();
}
function init(){
scene=new THREE.Scene(); scene.background=new THREE.Color(0x87ceeb);
camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
renderer=new THREE.WebGLRenderer(); renderer.setSize(innerWidth,innerHeight); document.body.appendChild(renderer.domElement);
let light=new THREE.AmbientLight(0xffffff,0.9); scene.add(light);
let ground=new THREE.Mesh(new THREE.BoxGeometry(100,1,100), new THREE.MeshBasicMaterial({color:0x2d5a2d})); ground.position.y=-1; scene.add(ground);
for(let i=0;i<15;i++){
let b=new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshBasicMaterial({color:0x888888}));
b.position.set(Math.random()*60-30,0,Math.random()*60-30); scene.add(b);
}
for(let i=0;i<8;i++) spawn();
camera.position.set(0,1.6,10);
document.addEventListener('mousemove',e=>{ if(document.pointerLockElement){ yaw-=e.movementX*0.003; pitch-=e.movementY*0.003; pitch=Math.max(-1.2,Math.min(1.2,pitch)); }});
document.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.addEventListener('click',shoot);
animate();
}
function spawn(){
let t=new THREE.Mesh(new THREE.SphereGeometry(0.8,16,16), new THREE.MeshBasicMaterial({color:0xff0000}));
t.position.set(Math.random()*40-20,1,Math.random()*40-20); scene.add(t); targets.push(t);
}
function shoot(){
if(ammo<=0){ ammo=30; }
ammo--; document.getElementById('ammo').innerText=ammo;
let ray=new THREE.Raycaster(); ray.setFromCamera({x:0,y:0},camera);
let hits=ray.intersectObjects(targets);
if(hits.length){ let o=hits[0].object; scene.remove(o); targets=targets.filter(x=>x!==o); score+=100; document.getElementById('score').innerText=score; spawn(); }
}
function animate(){
requestAnimationFrame(animate);
let s=0.12;
let f=new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(0,yaw,0));
let r=new THREE.Vector3(1,0,0).applyEuler(new THREE.Euler(0,yaw,0));
if(keys['w']) camera.position.addScaledVector(f,s);
if(keys['s']) camera.position.addScaledVector(f,-s);
if(keys['a']) camera.position.addScaledVector(r,-s);
if(keys['d']) camera.position.addScaledVector(r,s);
camera.rotation.set(pitch,yaw,0,'YXZ');
renderer.render(scene,camera);
}
</script>
</body>
</html>
